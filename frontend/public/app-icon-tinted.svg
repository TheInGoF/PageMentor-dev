<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Transparent background so iOS 18 "Tinted" home-screen picks up the
       user's tint colour. Monochrome white silhouette = looks like a
       glass/clear rendition. Dark mode on devices without tinting just
       shows white books. -->
  <rect x="2.5" y="15.5" width="19" height="5" rx="0.8" fill="#ffffff" opacity="0.95"/>
  <rect x="4.5" y="16.6" width="0.7" height="2.8" fill="rgba(0,0,0,0.25)"/>
  <rect x="6" y="16.6" width="0.5" height="2.8" fill="rgba(0,0,0,0.25)"/>

  <rect x="3.5" y="9.5" width="17" height="5" rx="0.8" fill="#ffffff"/>
  <rect x="5.5" y="10.6" width="0.7" height="2.8" fill="rgba(0,0,0,0.25)"/>
  <rect x="7" y="10.6" width="0.5" height="2.8" fill="rgba(0,0,0,0.25)"/>

  <rect x="4.5" y="3.5" width="15" height="5" rx="0.8" fill="#ffffff" opacity="0.85"/>
  <rect x="6.5" y="4.6" width="0.7" height="2.8" fill="rgba(0,0,0,0.25)"/>
  <rect x="8" y="4.6" width="0.5" height="2.8" fill="rgba(0,0,0,0.25)"/>
</svg>
