<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Warm off-white background with a very soft red halo -->
  <rect width="24" height="24" fill="#fafafa"/>
  <circle cx="12" cy="12" r="10" fill="#ef4444" opacity="0.08"/>

  <!-- Bottom — medium red -->
  <rect x="2.5" y="15.5" width="19" height="5" rx="0.8" fill="#dc2626"/>
  <rect x="4.5" y="16.6" width="0.7" height="2.8" fill="rgba(0,0,0,0.45)"/>
  <rect x="6" y="16.6" width="0.5" height="2.8" fill="rgba(0,0,0,0.45)"/>

  <!-- Middle — accent -->
  <rect x="3.5" y="9.5" width="17" height="5" rx="0.8" fill="#ef4444"/>
  <rect x="5.5" y="10.6" width="0.7" height="2.8" fill="rgba(0,0,0,0.45)"/>
  <rect x="7" y="10.6" width="0.5" height="2.8" fill="rgba(0,0,0,0.45)"/>

  <!-- Top — darker red -->
  <rect x="4.5" y="3.5" width="15" height="5" rx="0.8" fill="#991b1b"/>
  <rect x="6.5" y="4.6" width="0.7" height="2.8" fill="rgba(0,0,0,0.45)"/>
  <rect x="8" y="4.6" width="0.5" height="2.8" fill="rgba(0,0,0,0.45)"/>
  <rect x="5.2" y="3.7" width="14" height="0.6" rx="0.3" fill="rgba(255,255,255,0.25)"/>
</svg>
