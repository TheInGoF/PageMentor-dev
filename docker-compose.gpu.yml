# GPU override for NVIDIA hosts.
#
# Host prerequisites:
#   - NVIDIA GPU (RTX 20xx / 30xx / 40xx / 50xx)
#   - NVIDIA driver >= 535
#   - nvidia-container-toolkit:
#       https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/install-guide.html
#     Short: `sudo apt install nvidia-container-toolkit` + daemon reload
#
# Deploy:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# Attaches Docling (the only GPU-capable service in the main stack) to
# the NVIDIA runtime. TTS does NOT run here — the GPU host carries a
# separate stack with Ollama + vLLM-Qwen-TTS + pm-gpu-arbiter, see
# docker-compose.gpu-host.example.yaml.
#
# Expected GPU speedup: Docling 10-30x (100-page PDF in ~30-60 s
# instead of 25-70 min on a Synology CPU).

services:
  docling:
    image: quay.io/docling-project/docling-serve:v1.16.1
    environment:
      DOCLING_DEVICE: cuda
      # More parallelism makes sense on GPU — the bottleneck shifts
      # from host RAM to VRAM.
      DOCLING_SERVE_ENG_LOC_NUM_WORKERS: "2"
      DOCLING_PERF_PAGE_BATCH_SIZE: "4"
      # NNPACK is CPU-only, so on GPU hosts it's irrelevant — leaving
      # PYTORCH_NNPACK_DISABLE unset on purpose (default is harmless).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
