name: build pm-qwen-tts

# Triggert nur bei Änderungen im Sidecar-Ordner oder am Workflow selbst.
# Das Image wird ~3-4 GB groß (PyTorch-CUDA-Base + flash-attn). Der
# Build-Prozess:
#   - Stage 1 (-devel): flash-attn 2.7.2 aus Source, ~15-20 min mit
#     MAX_JOBS=2. Docker-Layer-Cache macht nachfolgende Builds schneller
#     wenn sich weder torch noch flash-attn ändern.
#   - Stage 2 (runtime): schlankes Image mit nur dem kompilierten
#     flash-attn-Package.
# Insgesamt ~20-30 min beim ersten Build, ~2-5 min wenn Cache trifft.
on:
  push:
    branches: [main]
    tags: ["qwen-tts-v*"]
    paths:
      - "pm-qwen-tts/**"
      - ".github/workflows/publish-qwen-tts.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # flash-attn aus Source ist C++-schwer; default 6h ist ausreichend,
    # aber wir setzen 60 min als Hard-Safety, damit ein hängender Build
    # nicht still 6h Minuten frisst.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/lordvonbaum/pm-qwen-tts
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./pm-qwen-tts
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
