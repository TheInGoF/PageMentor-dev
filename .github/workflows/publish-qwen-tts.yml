name: build pm-qwen-tts

# Triggert nur bei Änderungen im Sidecar-Ordner oder am Workflow selbst
# — spart CI-Minuten wenn nur Backend/Frontend-Code committed wird.
# Das Image wird ~2-3 GB groß (PyTorch-CUDA-Base), baut ~5-8 min auf
# Github-Runners und erst beim ersten Container-Start lädt es Qwen-TTS-
# Flash (~5 GB) aus dem HF-Hub.
on:
  push:
    branches: [main]
    tags: ["qwen-tts-v*"]
    paths:
      - "pm-qwen-tts/**"
      - ".github/workflows/publish-qwen-tts.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/lordvonbaum/pm-qwen-tts
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./pm-qwen-tts
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
