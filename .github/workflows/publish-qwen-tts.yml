name: build pm-qwen-tts

# Triggers only on changes inside the sidecar folder or this workflow itself.
# The image ends up ~3-4 GB (PyTorch-CUDA base + flash-attn). Build process:
#   - Stage 1 (-devel): flash-attn 2.7.2 from source, ~15-20 min with
#     MAX_JOBS=2. Docker layer cache makes subsequent builds much faster
#     as long as neither torch nor flash-attn change.
#   - Stage 2 (runtime): slim image with only the compiled flash-attn
#     package.
# Total ~20-30 min on first build, ~2-5 min on a cache hit.
on:
  push:
    branches: [main]
    tags: ["qwen-tts-v*"]
    paths:
      - "pm-qwen-tts/**"
      - ".github/workflows/publish-qwen-tts.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # flash-attn from source is C++-heavy; the GHA default of 6h is plenty,
    # but we cap at 60 min as hard safety so a hung build doesn't quietly
    # eat 6h of CI minutes.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      # The default GHA runner has only ~14 GB free — pytorch-devel alone is
      # 17 GB plus flash-attn build temp files. Without reclaiming space the
      # build dies with "No space left on device". This action frees ~30 GB
      # of preinstalled junk (dotnet, swift, android-sdk, haskell, …).
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false  # we need these in a moment
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/theingof/pm-qwen-tts-dev
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./pm-qwen-tts
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
