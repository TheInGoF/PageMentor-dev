name: windows

# Nur wenn sich App, Build oder Paket ändern; sonst von Hand
on:
  push:
    paths:
      - "backend/**"
      - "frontend/**"
      - "engine/**"
      - "packaging/**"
      - "scripts/build-windows.sh"
      - "scripts/fetch-windows-tools.sh"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

# Ältere Läufe desselben Branches abbrechen
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Exe und Paket bauen
        run: scripts/build-windows.sh dist/PageMentor

      - name: Smoke-Test der Exe unter Windows
        working-directory: backend
        run: PM_SMOKE_EXE="$(cygpath -w "$GITHUB_WORKSPACE/dist/PageMentor/PageMentor.exe")" bun scripts/smoke.ts

      - name: Start ohne Einstellungen, Dokumente-Ordner und Werkzeuge
        shell: pwsh
        run: |
          $env:PM_ENGINE_AUTOSTART = "0"
          $env:PM_UI = "none"
          $p = Start-Process -FilePath "dist/PageMentor/PageMentor.exe" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 1
            try { Invoke-RestMethod http://127.0.0.1:3100/api/health | Out-Host; $ok = $true; break } catch {}
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { throw "App antwortet nicht auf Port 3100" }
          if (-not (Test-Path "dist/PageMentor/engine/provision.sh")) { throw "Engine-Skripte fehlen im Paket" }
          if ((Get-Content -Raw "dist/PageMentor/engine/provision.sh") -match "`r") { throw "provision.sh hat CRLF" }
          $dir = Join-Path ([Environment]::GetFolderPath('MyDocuments')) "PageMentor"
          Get-Content (Join-Path $dir "logs/startup.log")
          if (-not (Test-Path (Join-Path $dir "pagementor.db"))) { throw "Datenbank fehlt in $dir" }
          $log = Get-Content -Raw (Join-Path $dir "logs/startup.log")
          foreach ($t in "ffmpeg","ffprobe","pdftoppm","AtomicParsley") {
            if ($log -match ('"' + $t + '":"FEHLT"')) { throw "Werkzeug fehlt: $t" }
          }

      - name: App-Fenster testen
        shell: pwsh
        run: |
          $env:PM_ENGINE_AUTOSTART = "0"
          $env:PM_UI = "window"
          $env:PM_WINDOW_TEST = "1"
          $p = Start-Process -FilePath "dist/PageMentor/PageMentor.exe" -PassThru
          Start-Sleep -Seconds 5
          # Bildschirmfoto, solange das Fenster offen ist
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          New-Item -ItemType Directory -Force dist/screens | Out-Null
          $bmp.Save("dist/screens/app-window.png")
          $p.WaitForExit(60000) | Out-Null
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          $dir = Join-Path ([Environment]::GetFolderPath('MyDocuments')) "PageMentor\logs"
          $log = Get-Content -Raw (Get-ChildItem "$dir\app-*.log" | Sort-Object LastWriteTime | Select-Object -Last 1).FullName
          $log -split "`n" | Select-String "Fenster|Edge" | Out-Host
          # Worker muss in der Exe stecken; ob der Runner zeichnen kann, ist zweitrangig
          if ($log -notmatch "App-Fenster geöffnet|nutze Edge") { throw "Fenster-Worker nicht gestartet" }
          if ($log -notmatch "App-Fenster rahmenlos") { Write-Warning "Fenster hat den Windows-Rahmen behalten" }
          if ($log -notmatch "App-Fenster bereit") { Write-Warning "Fenster hat die Seite nicht gemeldet" }
          if ($log -notmatch "Fenster geschlossen") { Write-Warning "Fenster wurde nicht über die eigene Leiste geschlossen" }

      - uses: actions/upload-artifact@v4
        with:
          name: PageMentor-Fenster
          path: dist/screens/
          retention-days: 7

      - name: Installer bauen
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $version = (Get-Content VERSION -Raw).Trim()
          & $iscc "/DAppVersion=$version" "/DSourceDir=$env:GITHUB_WORKSPACE\dist\PageMentor" packaging\windows\PageMentor.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC fehlgeschlagen" }

      - name: Installer still installieren, starten, deinstallieren
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\PageMentor-Setup-*.exe | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/NOWSL=1","/LOG=$env:RUNNER_TEMP\setup.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\setup.log" -Tail 40; throw "Setup Exit $($p.ExitCode)" }
          $app = "$env:LOCALAPPDATA\Programs\PageMentor"
          foreach ($f in "PageMentor.exe","public\index.html","bin\ffmpeg.exe","engine\provision.sh") {
            if (-not (Test-Path "$app\$f")) { throw "fehlt nach Installation: $f" }
          }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\PageMentor.lnk")) { throw "Startmenü-Eintrag fehlt" }
          Get-ChildItem ([Environment]::GetFolderPath('MyDocuments') + "\PageMentor\logs") | Out-Host
          Stop-Process -Name PageMentor -Force -ErrorAction SilentlyContinue
          $u = Start-Process "$app\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "Deinstallation Exit $($u.ExitCode)" }
          Start-Sleep -Seconds 3
          if (Test-Path "$app\PageMentor.exe") { throw "Exe nach Deinstallation noch da" }
          if (-not (Test-Path ([Environment]::GetFolderPath('MyDocuments') + "\PageMentor"))) { throw "Nutzerdaten wurden gelöscht" }

      - uses: actions/upload-artifact@v4
        with:
          name: PageMentor-Setup
          path: dist/PageMentor-Setup-*.exe
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: PageMentor-windows
          path: dist/PageMentor
          retention-days: 14
