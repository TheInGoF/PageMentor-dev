name: build pm-docling-de

# Triggers only on changes inside the pm-docling-de folder or this
# workflow itself. The image is a thin layer on top of docling-serve
# (just adds the German tesseract pack), so it rebuilds rarely.
on:
  push:
    branches: [main]
    tags: ["docling-de-v*"]
    paths:
      - "pm-docling-de/**"
      - ".github/workflows/publish-docling-de.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # The docling base image is CUDA-sized (~10 GB unpacked); pulling
      # + building it exhausts the ~14 GB free disk of a standard
      # runner ("No space left on device", seen twice on 2026-07-02).
      # Dropping the pre-installed toolchains we never use frees ~25 GB.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet \
            /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/theingof/pm-docling-de
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./pm-docling-de
          push: true
          # amd64 only — the base image is CUDA-targeted, arm64 wouldn't
          # have the GPU stack and would be misleading to ship.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
