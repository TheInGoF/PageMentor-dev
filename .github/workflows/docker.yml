name: build docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      piper_langs:
        description: "Piper voice languages (comma-separated, e.g. de,en,fr). Must match an existing pagementor-piper-voices tag — otherwise run that workflow first."
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve piper-voices tag
        id: voices
        run: |
          raw="${{ inputs.piper_langs != '' && inputs.piper_langs || vars.PIPER_LANGS || 'de,en' }}"
          tag="$(echo "$raw" \
            | tr '[:upper:]' '[:lower:]' \
            | tr -d ' ' \
            | tr ',' '\n' \
            | sort -u \
            | paste -sd- -)"
          echo "image=ghcr.io/lordvonbaum/pagementor-piper-voices:${tag}" >> "$GITHUB_OUTPUT"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/lordvonbaum/pagementor
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Main app never downloads voices itself — it COPYs from the
          # pre-built piper-voices image resolved above.
          build-args: |
            PIPER_VOICES_IMAGE=${{ steps.voices.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
