name: build docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      piper_langs:
        description: "Piper voice languages to bake in (comma-separated, e.g. de,en,fr)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Repository owner lowercased — ghcr.io requires lowercase.
          images: ghcr.io/lordvonbaum/pagementor
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # PIPER_LANGS resolution order:
          #   1. workflow_dispatch input (one-off build with custom langs)
          #   2. repository variable PIPER_LANGS (persistent override,
          #      set under Settings → Secrets and variables → Actions → Variables)
          #   3. Dockerfile ARG default (de,en)
          build-args: |
            PIPER_LANGS=${{ inputs.piper_langs != '' && inputs.piper_langs || vars.PIPER_LANGS || 'de,en' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
