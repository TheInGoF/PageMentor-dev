name: checks

on:
  push:
  pull_request:

# Ältere Läufe desselben Branches abbrechen
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Zeilenlimit
        run: scripts/check-lines.sh

      - name: Changelog zur Version
        run: scripts/check-changelog.sh

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Backend installieren
        working-directory: backend
        run: bun install

      # ffmpeg für den Test, der eine Lernhörbuch-Einheit wirklich zusammensetzt (Stille, Verketten, Lautheit)
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Backend Typecheck
        working-directory: backend
        run: npx tsc --noEmit -p .

      - name: Backend Unit-Tests
        working-directory: backend
        run: bun test

      - name: Backend Smoke-Test
        working-directory: backend
        run: bun scripts/smoke.ts

      - name: Frontend Build
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build

      - name: Python Syntax + undefinierte Namen
        run: |
          python3 -m pip install -q pyflakes
          python3 -m pyflakes pm-gpu-arbiter pm-qwen-tts pm-tts-common pm-kokoro-tts pm-f5-tts pm-tada-tts

      - name: Arbiter mit mehreren Engines
        run: |
          python3 -m pip install -q fastapi httpx docker
          python3 pm-gpu-arbiter/tests/test_arbiter.py

  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Compose-Datei gültig
        run: docker compose -f engine/compose.yaml config -q

      - name: provision.sh in frischem Ubuntu 24.04, zweimal (idempotent)
        run: |
          docker run --rm -v "$PWD/engine:/engine:ro" -e PM_SKIP_START=1 ubuntu:24.04 bash -c '
            set -e
            /engine/provision.sh
            echo "--- zweiter Lauf ---"
            /engine/provision.sh | tee /tmp/second.log
            grep -q "Schon vorhanden: docker-ce" /tmp/second.log
            grep -q "compose.yaml unverändert" /tmp/second.log
            docker --version
            nvidia-ctk --version
          '

