name: build pm-kokoro-tts

# Kokoro Deutsch (CPU, ~1 GB), nur bei Änderungen am Sidecar oder am gemeinsamen Unterbau
on:
  push:
    branches: [main]
    paths:
      - "pm-kokoro-tts/**"
      - "pm-tts-common/**"
      - ".github/workflows/publish-kokoro-tts.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/theingof/pm-kokoro-tts
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: pm-kokoro-tts/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=kokoro-tts
          cache-to: type=gha,mode=max,scope=kokoro-tts
