name: build pm-tada-tts

# tada (PyTorch-CUDA, ~9 GB), nur bei Änderungen am Sidecar oder am gemeinsamen Unterbau
on:
  push:
    branches: [main]
    paths:
      - "pm-tada-tts/**"
      - "pm-tts-common/**"
      - ".github/workflows/publish-tada-tts.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      # PyTorch-Basis braucht mehr Platz, als der Runner frei hat
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/theingof/pm-tada-tts
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: pm-tada-tts/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=tada-tts
          cache-to: type=gha,mode=max,scope=tada-tts
