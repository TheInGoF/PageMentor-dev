name: build piper-voices image

# Separate image that carries piper binary + voice models. Published to
# ghcr.io/<owner>/pagementor-piper-voices with tags derived from the
# PIPER_LANGS set (sorted, comma→dash — so "de,en" == "en,de" == "de-en").
#
# Runs only when the download script, this workflow, or the voices
# Dockerfile changes. The main app build consumes the image via
# COPY --from= in the main Dockerfile, which keeps app builds fast.

on:
  push:
    branches: [main]
    paths:
      - "docker/Dockerfile.piper-voices"
      - "docker/download-piper-voices.sh"
      - ".github/workflows/piper-voices.yml"
  workflow_dispatch:
    inputs:
      piper_langs:
        description: "Comma-separated language codes (e.g. de,en,fr)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve PIPER_LANGS and tag
        id: langs
        run: |
          raw="${{ inputs.piper_langs != '' && inputs.piper_langs || vars.PIPER_LANGS || 'de,en' }}"
          # normalise: lowercase, strip spaces, split on comma, sort, rejoin with '-'
          tag="$(echo "$raw" \
            | tr '[:upper:]' '[:lower:]' \
            | tr -d ' ' \
            | tr ',' '\n' \
            | sort -u \
            | paste -sd- -)"
          echo "value=$raw" >> "$GITHUB_OUTPUT"
          echo "tag=$tag"   >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: docker
          file: docker/Dockerfile.piper-voices
          push: true
          tags: |
            ghcr.io/lordvonbaum/pagementor-piper-voices:${{ steps.langs.outputs.tag }}
            ghcr.io/lordvonbaum/pagementor-piper-voices:latest
          build-args: |
            PIPER_LANGS=${{ steps.langs.outputs.value }}
          cache-from: type=gha,scope=piper-voices
          cache-to: type=gha,scope=piper-voices,mode=max
