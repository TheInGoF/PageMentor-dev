<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="0.6"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)" opacity="0.7"/>

  <!-- Accent bars top + bottom -->
  <rect x="0" y="0" width="1280" height="6" fill="url(#accent)"/>
  <rect x="0" y="634" width="1280" height="6" fill="url(#accent)"/>

  <!-- Logo block (top-right): the same three-volume bookshelf icon used
       inside the app (frontend/public/app-icon-dark.svg), embedded
       verbatim and scaled from its native 24×24 viewBox to 170×170. -->
  <g transform="translate(1040, 70)">
    <svg x="0" y="0" width="170" height="170" viewBox="0 0 24 24">
      <rect width="24" height="24" fill="#0a0a0a"/>
      <circle cx="12" cy="12" r="10" fill="#ef4444" opacity="0.18"/>

      <!-- Bottom — medium red -->
      <rect x="2.5" y="15.5" width="19" height="5" rx="0.8" fill="#dc2626"/>
      <rect x="4.5" y="16.6" width="0.7" height="2.8" fill="rgba(0,0,0,0.35)"/>
      <rect x="6" y="16.6" width="0.5" height="2.8" fill="rgba(0,0,0,0.35)"/>

      <!-- Middle — accent -->
      <rect x="3.5" y="9.5" width="17" height="5" rx="0.8" fill="#ef4444"/>
      <rect x="5.5" y="10.6" width="0.7" height="2.8" fill="rgba(0,0,0,0.35)"/>
      <rect x="7" y="10.6" width="0.5" height="2.8" fill="rgba(0,0,0,0.35)"/>

      <!-- Top — darker red -->
      <rect x="4.5" y="3.5" width="15" height="5" rx="0.8" fill="#991b1b"/>
      <rect x="6.5" y="4.6" width="0.7" height="2.8" fill="rgba(0,0,0,0.35)"/>
      <rect x="8" y="4.6" width="0.5" height="2.8" fill="rgba(0,0,0,0.35)"/>
      <rect x="5.2" y="3.7" width="14" height="0.6" rx="0.3" fill="rgba(255,255,255,0.15)"/>
    </svg>
    <!-- accent border around the icon to anchor it visually -->
    <rect x="0" y="0" width="170" height="170" rx="32" fill="none" stroke="#ef4444" stroke-width="1.5"/>
  </g>

  <!-- Title block -->
  <g transform="translate(80, 200)">
    <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="118" font-weight="700" fill="#f5f5f5">
      Page<tspan fill="#ef4444">Mentor</tspan>
    </text>

    <text x="0" y="78" font-family="Helvetica, Arial, sans-serif" font-size="36" font-weight="400" fill="#a3a3a3">
      Lecture PDFs to audiobooks, flashcards &amp; exams.
    </text>

    <text x="0" y="174" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#cfcfcf">
      Self-hosted.  Local LLM + TTS.  No cloud, no subscription.
    </text>

    <!-- Feature pills -->
    <g transform="translate(0, 240)" font-family="Menlo, monospace" font-size="20" fill="#ef4444">
      <g>
        <rect x="0" y="-22" width="118" height="34" rx="17" fill="none" stroke="#ef4444" stroke-width="1.5"/>
        <text x="59" y="2" text-anchor="middle">Listen</text>
      </g>
      <g transform="translate(138, 0)">
        <rect x="0" y="-22" width="148" height="34" rx="17" fill="none" stroke="#ef4444" stroke-width="1.5"/>
        <text x="74" y="2" text-anchor="middle">Memorise</text>
      </g>
      <g transform="translate(306, 0)">
        <rect x="0" y="-22" width="138" height="34" rx="17" fill="none" stroke="#ef4444" stroke-width="1.5"/>
        <text x="69" y="2" text-anchor="middle">Practice</text>
      </g>
      <g transform="translate(464, 0)">
        <rect x="0" y="-22" width="170" height="34" rx="17" fill="none" stroke="#ef4444" stroke-width="1.5"/>
        <text x="85" y="2" text-anchor="middle">Ollama + TTS</text>
      </g>
      <g transform="translate(654, 0)">
        <rect x="0" y="-22" width="138" height="34" rx="17" fill="none" stroke="#ef4444" stroke-width="1.5"/>
        <text x="69" y="2" text-anchor="middle">M4B + RSS</text>
      </g>
    </g>
  </g>

  <!-- Footer -->
  <text x="80" y="600" font-family="Menlo, monospace" font-size="16" fill="#5a5a5a">
    github.com/TheInGoF/PageMentor  ·  AGPLv3
  </text>
</svg>
