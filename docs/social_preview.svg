<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="0.6"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)" opacity="0.7"/>

  <!-- Accent bars top + bottom -->
  <rect x="0" y="0" width="1280" height="6" fill="url(#accent)"/>
  <rect x="0" y="634" width="1280" height="6" fill="url(#accent)"/>

  <!-- Logo block (top-right): stylised book + headphones, the project's two halves -->
  <g transform="translate(1040, 70)">
    <!-- rounded card behind the icon -->
    <rect x="0" y="0" width="170" height="170" rx="32" fill="#0a0a0a" stroke="#ef4444" stroke-width="1.5"/>

    <!-- Open book -->
    <g transform="translate(28, 40)">
      <!-- left page -->
      <path d="M 0 14 Q 0 6 8 6 L 54 6 Q 56 6 56 8 L 56 96 Q 56 98 54 98 L 8 98 Q 0 98 0 90 Z"
            fill="#1f1f1f" stroke="#e8e8e8" stroke-width="2"/>
      <!-- right page -->
      <path d="M 114 14 Q 114 6 106 6 L 60 6 Q 58 6 58 8 L 58 96 Q 58 98 60 98 L 106 98 Q 114 98 114 90 Z"
            fill="#1f1f1f" stroke="#e8e8e8" stroke-width="2"/>
      <!-- spine -->
      <line x1="57" y1="6" x2="57" y2="98" stroke="#e8e8e8" stroke-width="2"/>
      <!-- text lines -->
      <line x1="10" y1="28" x2="48" y2="28" stroke="#9ca3af" stroke-width="2"/>
      <line x1="10" y1="40" x2="44" y2="40" stroke="#9ca3af" stroke-width="2"/>
      <line x1="10" y1="52" x2="48" y2="52" stroke="#9ca3af" stroke-width="2"/>
      <line x1="66" y1="28" x2="104" y2="28" stroke="#9ca3af" stroke-width="2"/>
      <line x1="66" y1="40" x2="100" y2="40" stroke="#9ca3af" stroke-width="2"/>
      <line x1="66" y1="52" x2="104" y2="52" stroke="#9ca3af" stroke-width="2"/>
    </g>

    <!-- Headphones overlay (bottom of icon, in red) -->
    <g transform="translate(45, 100)">
      <path d="M 0 26 Q 0 0 40 0 Q 80 0 80 26"
            fill="none" stroke="#ef4444" stroke-width="5" stroke-linecap="round"/>
      <rect x="-6" y="22" width="14" height="22" rx="4" fill="#ef4444"/>
      <rect x="72" y="22" width="14" height="22" rx="4" fill="#ef4444"/>
    </g>
  </g>

  <!-- Title block -->
  <g transform="translate(80, 200)">
    <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="118" font-weight="700" fill="#f5f5f5">
      Page<tspan fill="#ef4444">Mentor</tspan>
    </text>

    <text x="0" y="78" font-family="Helvetica, Arial, sans-serif" font-size="36" font-weight="400" fill="#a3a3a3">
      Lecture PDFs to audiobooks, flashcards &amp; exams.
    </text>

    <text x="0" y="174" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#cfcfcf">
      Self-hosted.  Local LLM + TTS.  No cloud, no subscription.
    </text>

    <!-- Feature pills -->
    <g transform="translate(0, 240)" font-family="Menlo, monospace" font-size="20" fill="#ef4444">
      <g>
        <rect x="0" y="-22" width="118" height="34" rx="17" fill="none" stroke="#ef4444" stroke-width="1.5"/>
        <text x="59" y="2" text-anchor="middle">Listen</text>
      </g>
      <g transform="translate(138, 0)">
        <rect x="0" y="-22" width="148" height="34" rx="17" fill="none" stroke="#ef4444" stroke-width="1.5"/>
        <text x="74" y="2" text-anchor="middle">Memorise</text>
      </g>
      <g transform="translate(306, 0)">
        <rect x="0" y="-22" width="138" height="34" rx="17" fill="none" stroke="#ef4444" stroke-width="1.5"/>
        <text x="69" y="2" text-anchor="middle">Practice</text>
      </g>
      <g transform="translate(464, 0)">
        <rect x="0" y="-22" width="170" height="34" rx="17" fill="none" stroke="#ef4444" stroke-width="1.5"/>
        <text x="85" y="2" text-anchor="middle">Ollama + TTS</text>
      </g>
      <g transform="translate(654, 0)">
        <rect x="0" y="-22" width="138" height="34" rx="17" fill="none" stroke="#ef4444" stroke-width="1.5"/>
        <text x="69" y="2" text-anchor="middle">M4B + RSS</text>
      </g>
    </g>
  </g>

  <!-- Footer -->
  <text x="80" y="600" font-family="Menlo, monospace" font-size="16" fill="#5a5a5a">
    github.com/TheInGoF/PageMentor  ·  AGPLv3
  </text>
</svg>
