# Synology / Portainer bind-mount deployment.
#
# Before first start, create the folders on the NAS (File Station or SSH):
#   /volume1/docker/pagementor/data
#   /volume1/docker/pagementor/meili
#   /volume1/docker/pagementor/ollama          (optional, only with --profile ai)
#
# Then either:
#   A) CLI:       docker compose up -d
#   B) Portainer: paste this file into "Stacks > Add Stack > Web editor".

name: pagementor

services:
  app:
    image: ghcr.io/lordvonbaum/pagementor:latest
    container_name: pm-app
    restart: unless-stopped
    ports:
      - "${PM_PORT:-3100}:3000"
    environment:
      PM_PASSWORD: ${PM_PASSWORD:-changeme}
      PM_DATA_DIR: /data
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-pm-dev-key}
      # LLM provider chain — first that answers is used.
      # All optional; runtime-overridable via the Settings modal
      # (persisted to data/llm-config.json).
      PM_OLLAMA_URL_PC: ${PM_OLLAMA_URL_PC:-}
      PM_OLLAMA_URL_MAC: ${PM_OLLAMA_URL_MAC:-}
      PM_OLLAMA_URL: ${PM_OLLAMA_URL:-}
      PM_OLLAMA_MODEL: ${PM_OLLAMA_MODEL:-llama3.1:8b}
      PM_ANTHROPIC_API_KEY: ${PM_ANTHROPIC_API_KEY:-}
      PM_ANTHROPIC_MODEL: ${PM_ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
    volumes:
      - /volume1/docker/pagementor/data:/data
    depends_on:
      meilisearch: { condition: service_healthy }

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: pm-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-pm-dev-key}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - /volume1/docker/pagementor/meili:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: pm-ollama
    profiles: ["ai"]
    restart: unless-stopped
    volumes:
      - /volume1/docker/pagementor/ollama:/root/.ollama
