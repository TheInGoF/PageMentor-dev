# Synology / Portainer bind-mount deployment.
#
# Before first start, create the folders on the NAS (File Station or SSH):
#   /volume1/docker/pagementor/data
#   /volume1/docker/pagementor/meili
#   /volume1/docker/pagementor/docling-cache
#   /volume1/docker/pagementor/kokoro-cache
#
# (Der Docling-Container läuft als root — Red Hat UBI startet sonst als
# UID 1001, was mit Synology-Bind-Mounts Permission-Probleme macht. Die
# Modelle im docling-cache sind dadurch auf dem Host root-owned. Zum
# Löschen via SSH: `sudo rm -rf /volume1/docker/pagementor/docling-cache`.)
#
# Then either:
#   A) CLI:       docker compose up -d
#   B) Portainer: paste this file into "Stacks > Add Stack > Web editor".
#
# All LLM endpoints (Ollama URLs, API keys, models) are configured
# live in the Settings modal — they persist to data/llm-config.json
# and survive container rebuilds. No ENV juggling needed.

name: pagementor

services:
  app:
    image: ghcr.io/lordvonbaum/pagementor:latest
    # Only used when you run `docker compose build` locally.
    # `compose up` pulls the pre-built image from ghcr.io.
    build:
      context: .
    container_name: pm-app
    restart: unless-stopped
    ports:
      - "${PM_PORT:-3100}:3000"
    environment:
      PM_PASSWORD: ${PM_PASSWORD:-changeme}
      PM_DATA_DIR: /data
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-pm-dev-key}
      PM_DOCLING_URL: http://docling:5001
      PM_DOCLING_API_KEY: ${DOCLING_API_KEY:-pm-docling-internal}
      PM_KOKORO_URL: http://kokoro:8880
    volumes:
      - /volume1/docker/pagementor/data:/data
    depends_on:
      meilisearch: { condition: service_healthy }
      docling: { condition: service_started }
      kokoro: { condition: service_started }

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: pm-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-pm-dev-key}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - /volume1/docker/pagementor/meili:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Docling als einzige Text-Extraktion. CPU-Image (keine GPU auf dem
  # DS920+). Erste Runs laden ~1-2 GB Modelle nach ~/.cache in den
  # Container — sichtbar auf der NAS unter docling-cache/, damit man
  # den Plattenverbrauch sieht und bei Bedarf löschen kann.
  #
  # user: "0:0" damit der Container auch auf Synology-Bind-Mounts
  # schreiben darf (UBI-Base läuft sonst als UID 1001, was mit NAS-
  # Ownership kollidiert).
  #
  # CPU-Timing für ~100 Seiten auf J4125: 25-70 min. Darum ruft das
  # Backend ausschließlich den /v1/convert/file/async-Endpoint auf und
  # polled den Status über die interne SSE-Bus-Progress-Pipeline.
  docling:
    image: quay.io/docling-project/docling-serve-cpu:v1.16.1
    container_name: pm-docling
    restart: unless-stopped
    user: "0:0"
    environment:
      UVICORN_PORT: "5001"
      DOCLING_SERVE_API_KEY: ${DOCLING_API_KEY:-pm-docling-internal}
      DOCLING_SERVE_CORS_ORIGINS: '["*"]'
      DOCLING_SERVE_MAX_FILE_SIZE: "209715200"
      DOCLING_SERVE_MAX_NUM_PAGES: "2000"
      DOCLING_SERVE_ENG_LOC_NUM_WORKERS: "1"
      DOCLING_SERVE_LOAD_MODELS_AT_BOOT: "true"
      DOCLING_NUM_THREADS: "4"
      DOCLING_DEVICE: cpu
      DOCLING_PERF_PAGE_BATCH_SIZE: "2"
      # Schaltet die "Could not initialize NNPACK! Reason: Unsupported
      # hardware."-Flut ab. NNPACK braucht AVX-512, das hat der Celeron
      # nicht — PyTorch nimmt still den BLAS-Pfad, Ergebnis identisch.
      PYTORCH_NNPACK_DISABLE: "1"
    volumes:
      - /volume1/docker/pagementor/docling-cache:/opt/app-root/src/.cache

  # Kokoro-FastAPI als TTS-Sidecar. Apache-2.0-lizenziertes Modell
  # (~82 M Parameter), läuft auf CPU mit ~3-5x Realtime auf modernen
  # x86-Cores; auf GPU (siehe docker-compose.gpu.yml) ~30-50x.
  #
  # Default-Image enthält das Basis-Modell aber KEINE zusätzlichen
  # Voice-Packs. Beim ersten Start lädt der Sidecar die benötigten
  # Voice-Embeddings (~1 MB pro Stimme) bei der ersten Synthese-
  # Anfrage von HuggingFace nach und legt sie im Volume ab — danach
  # offline-tauglich.
  #
  # API: OpenAI-kompatibel unter /v1/audio/speech, Voice-Discovery
  # unter /v1/audio/voices.
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    container_name: pm-kokoro
    restart: unless-stopped
    environment:
      # Voice-Cache-Verzeichnis (passend zum Volume-Mount unten).
      MODELS_DIR: /app/api/src/models
      VOICES_DIR: /app/api/src/voices
    volumes:
      - /volume1/docker/pagementor/kokoro-cache:/app/api/src/voices
