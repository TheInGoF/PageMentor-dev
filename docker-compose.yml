# Synology / Portainer bind-mount deployment.
#
# Before first start, create the folders on the NAS (File Station or SSH):
#   /volume1/docker/pagementor/data
#   /volume1/docker/pagementor/meili
#   /volume1/docker/pagementor/docling-cache
#
# (The Docling container runs as root — the Red Hat UBI base image
# defaults to UID 1001 which collides with Synology bind-mount ownership.
# Side effect: the model files in docling-cache are root-owned on the
# host. To wipe them, SSH in and run
# `sudo rm -rf /volume1/docker/pagementor/docling-cache`.)
#
# Then either:
#   A) CLI:       docker compose up -d
#   B) Portainer: paste this file into "Stacks > Add Stack > Web editor".
#
# All tunables (Ollama URLs, cloud-LLM API keys, models, Qwen-TTS
# URL + API key, TTS chunk size, Audiobookshelf URL + API key +
# target library) are configured live from the Settings modal — they
# persist to data/llm-config.json and survive container rebuilds.
# No ENV juggling needed.

name: pagementor

services:
  app:
    image: ghcr.io/lordvonbaum/pagementor:latest
    # Only used when you run `docker compose build` locally.
    # `compose up` pulls the pre-built image from ghcr.io.
    build:
      context: .
    container_name: pm-app
    restart: unless-stopped
    ports:
      - "${PM_PORT:-3100}:3000"
    environment:
      PM_PASSWORD: ${PM_PASSWORD:-changeme}
      PM_DATA_DIR: /data
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-pm-dev-key}
      PM_DOCLING_URL: http://docling:5001
      PM_DOCLING_API_KEY: ${DOCLING_API_KEY:-pm-docling-internal}
      # TTS: the Qwen sidecar lives on the GPU host (e.g. RTX 3090 box)
      # behind pm-gpu-arbiter. URL is normally set once via the Settings
      # modal (persisted in data/llm-config.json). This ENV only acts as
      # a fallback default when the Settings field is empty.
      PM_QWEN_TTS_URL: ${PM_QWEN_TTS_URL:-}
    volumes:
      - /volume1/docker/pagementor/data:/data
    depends_on:
      meilisearch: { condition: service_healthy }
      docling: { condition: service_started }

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: pm-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-pm-dev-key}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - /volume1/docker/pagementor/meili:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Docling is the only text extractor. CPU image here (the DS920+
  # has no GPU). First runs download ~1-2 GB of models into the
  # container cache, surfaced on the NAS as docling-cache/ so disk
  # usage is visible and can be wiped if needed.
  #
  # user: "0:0" so the container can write into Synology bind mounts
  # (the UBI base image otherwise runs as UID 1001 which collides
  # with NAS ownership).
  #
  # CPU timing for ~100 pages on a Celeron J4125: 25-70 min. That's
  # why the backend always calls /v1/convert/file/async and streams
  # progress through the internal SSE bus — no blocking requests.
  docling:
    image: quay.io/docling-project/docling-serve-cpu:v1.16.1
    container_name: pm-docling
    restart: unless-stopped
    user: "0:0"
    environment:
      UVICORN_PORT: "5001"
      DOCLING_SERVE_API_KEY: ${DOCLING_API_KEY:-pm-docling-internal}
      DOCLING_SERVE_CORS_ORIGINS: '["*"]'
      DOCLING_SERVE_MAX_FILE_SIZE: "209715200"
      DOCLING_SERVE_MAX_NUM_PAGES: "2000"
      DOCLING_SERVE_ENG_LOC_NUM_WORKERS: "1"
      DOCLING_SERVE_LOAD_MODELS_AT_BOOT: "true"
      DOCLING_NUM_THREADS: "4"
      DOCLING_DEVICE: cpu
      DOCLING_PERF_PAGE_BATCH_SIZE: "2"
      # Silences the "Could not initialize NNPACK! Reason: Unsupported
      # hardware." log flood. NNPACK needs AVX-512 which the Celeron
      # lacks — PyTorch falls back to BLAS with identical output.
      PYTORCH_NNPACK_DISABLE: "1"
    volumes:
      - /volume1/docker/pagementor/docling-cache:/opt/app-root/src/.cache

  # Note: TTS does NOT run in this stack.
  #
  # Qwen3-TTS-Flash needs a CUDA GPU and shares the card with Ollama.
  # Both therefore live on a separate GPU host (e.g. Windows+WSL2 or
  # a Linux workstation with a 3090) behind pm-gpu-arbiter. See:
  #   docker-compose.gpu-host.example.yaml
  #   pm-gpu-arbiter/README.md
  #
  # PageMentor only talks to the arbiter — URL is configured in the
  # Settings modal (or via the PM_QWEN_TTS_URL default above).
