# Synology / Portainer bind-mount variant.
#
# Before first start, create the folders on the NAS (via File Station or SSH):
#   /volume1/docker/pagementor/data
#   /volume1/docker/pagementor/meili
#   /volume1/docker/pagementor/ollama          (optional, only with --profile ai)
#
# Then either:
#   A) CLI:       docker compose -f docker-compose.yml -f docker-compose.synology.yml up -d
#   B) Portainer: paste this file AS-IS into "Stacks > Add Stack > Web editor".
#
# Portainer-Users: this file is self-contained — don't combine it with the
# named-volumes file.

name: pagementor

services:
  app:
    image: ghcr.io/lordvonbaum/pagementor:latest
    container_name: pm-app
    restart: unless-stopped
    ports:
      - "${PM_PORT:-3100}:3000"
    environment:
      PM_PASSWORD: ${PM_PASSWORD:-changeme}
      PM_DATA_DIR: /data
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-pm-dev-key}
      PM_OLLAMA_URL: ${PM_OLLAMA_URL:-http://ollama:11434}
      PM_OLLAMA_MODEL: ${PM_OLLAMA_MODEL:-llama3.1:8b}
    volumes:
      - /volume1/docker/pagementor/data:/data
    depends_on:
      meilisearch: { condition: service_healthy }

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: pm-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-pm-dev-key}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - /volume1/docker/pagementor/meili:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: pm-ollama
    profiles: ["ai"]
    restart: unless-stopped
    volumes:
      - /volume1/docker/pagementor/ollama:/root/.ollama
