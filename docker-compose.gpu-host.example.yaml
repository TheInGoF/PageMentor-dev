# Example compose for the external GPU host (Windows+WSL2 or a Linux
# workstation with an NVIDIA GPU, e.g. RTX 3090, 24 GB VRAM).
#
# This stack does NOT run on the Synology — it runs on the GPU host
# next to PageMentor. It boots four services:
#
#   - ollama          ← LLM + embeddings
#   - docling         ← GPU PDF extraction
#   - qwen-tts        ← voice-clone TTS (Qwen3-TTS-Flash 1.7B Base)
#   - pm-gpu-arbiter  ← serialises GPU access between ollama and qwen-tts
#
# The arbiter is the only endpoint PageMentor (on the NAS) talks to —
# port 8790. It transparently forwards requests to ollama (11434) or
# qwen-tts (8880), unloads Ollama models before a TTS call and stops
# the TTS container before an LLM call. Docling runs independently
# (only a few 100 MB VRAM) — see VRAM-budget note at the bottom if
# things get tight.
#
# ----------------------------------------------------------------------
# Deploying on the GPU host:
#
#   1. Copy the file:
#        cp docker-compose.gpu-host.example.yaml docker-compose.yaml
#
#   2. Adjust secrets: DOCLING_SERVE_API_KEY must match DOCLING_API_KEY
#      in the NAS .env — otherwise Docling returns 401.
#
#   3. `docker compose pull && docker compose up -d`
#
#   4. Open firewall on the host: ports 8790 (arbiter) and 5001
#      (docling) must be reachable from the NAS IP. Ports 11434 and
#      8880 can stay private — the NAS does NOT talk to them directly.
#
#   5. In PageMentor → Settings → Local TTS → Arbiter URL, set
#      `http://<gpu-host-ip>:8790`. And → LLM → Ollama URL to
#      `http://<gpu-host-ip>:8790` (yes, same port — the arbiter
#      speaks both protocols).

services:
  ollama:
    image: ollama/ollama:latest
    container_name: pm-ollama
    restart: unless-stopped
    # Port 11434 stays exposed only for debug/bypass; PageMentor
    # talks to 8790 (arbiter) instead.
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_KEEP_ALIVE: "30m"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: "q8_0"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Init container that pulls all required models on first boot.
  # `restart: "no"` keeps it stopped after a successful pull run.
  # Swap the model list for whatever fits your VRAM budget — these
  # are just the defaults the author uses on a 24 GB 3090.
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_started
    volumes:
      - ollama-models:/root/.ollama
    environment:
      OLLAMA_HOST: "http://ollama:11434"
    entrypoint: >
      sh -c "
      sleep 8 &&
      ollama pull jina/jina-embeddings-v2-base-de &&
      ollama pull nomic-embed-text &&
      ollama pull gemma3:27b &&
      ollama pull llama3.1:8b
      "
    restart: "no"

  docling:
    image: quay.io/docling-project/docling-serve:v1.16.1
    container_name: pm-docling
    restart: unless-stopped
    ports:
      - "5001:5001"
    user: "0:0"
    environment:
      UVICORN_PORT: "5001"
      # Must match DOCLING_API_KEY in the NAS .env — otherwise 401.
      DOCLING_SERVE_API_KEY: "change-me-internal"
      DOCLING_SERVE_CORS_ORIGINS: '["*"]'
      DOCLING_SERVE_MAX_FILE_SIZE: "209715200"
      DOCLING_SERVE_MAX_NUM_PAGES: "2000"
      DOCLING_SERVE_ENG_LOC_NUM_WORKERS: "2"
      DOCLING_SERVE_LOAD_MODELS_AT_BOOT: "true"
      DOCLING_DEVICE: cuda
      DOCLING_PERF_PAGE_BATCH_SIZE: "4"
    volumes:
      - docling-cache:/opt/app-root/src/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Qwen3-TTS voice-clone sidecar. restart: "no" is mandatory — the
  # arbiter is the sole owner and starts/stops the container per
  # request. Docker must not fight it.
  #
  # Three TTS modes are selectable from PageMentor's Settings modal
  # without changing anything here:
  #   - Qwen-Base    → voice-cloned from a reference clip (3-10 s)
  #   - CustomVoice  → nine built-in presets + free-text instruction
  #   - VoiceDesign  → text-described voices (seed-reproducible)
  # The sidecar image handles all three; swap the model tag below if
  # you want Instruct-tuned or a quantised build.
  qwen-tts:
    image: ghcr.io/theingof/pm-qwen-tts:latest
    container_name: pm-qwen-tts
    restart: "no"
    ports:
      - "8880:8880"
    volumes:
      - qwen-tts-hf:/root/.cache/huggingface
    environment:
      QWEN_TTS_MODEL: "Qwen/Qwen3-TTS-12Hz-1.7B-Base"
      QWEN_TTS_DEVICE: "cuda"
      QWEN_TTS_DTYPE: "bfloat16"
      QWEN_TTS_ATTN_IMPL: "sdpa"       # "flash_attention_2" saves ~15% VRAM but needs a downstream rebuild
      QWEN_TTS_DEFAULT_LANGUAGE: "German"
      # Token / timeout budget. Each character of German narration
      # decodes to roughly 4-5 audio tokens on the 12 Hz codec, so for
      # 4000-char chunks you need ~22000 max_new_tokens and the
      # generation can take 8-12 min on a 3090. Tuned for chunks up
      # to ~4000 chars; lower if your chunks are smaller.
      QWEN_TTS_MAX_NEW_TOKENS: "22000"
      QWEN_TTS_GENERATION_TIMEOUT: "900"
      # Default sampling parameters used when the App-Settings leave
      # a field blank. Lower temperature + tighter top_p reduce
      # chunk-to-chunk timbre drift; repetition_penalty > 1.0 fights
      # the looping/garble bug seen on long voice clones
      # (Qwen3-TTS issue #258).
      QWEN_TTS_DEFAULT_TEMPERATURE: "0.75"
      QWEN_TTS_DEFAULT_TOP_P: "0.8"
      QWEN_TTS_DEFAULT_TOP_K: "40"
      QWEN_TTS_DEFAULT_REPETITION_PENALTY: "1.05"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # GPU arbiter — the only endpoint PageMentor actively talks to.
  # Proxy routes:
  #   /api/*      → Ollama   (stops qwen-tts first)
  #   /v1/audio/* → Qwen-TTS (unloads Ollama models + starts qwen-tts
  #                           first, stops it again afterwards)
  #   /admin/gpu/reset → flushes Ollama models + restarts qwen-tts
  #                      (exposed via the "GPU reset" button in the UI)
  pm-gpu-arbiter:
    image: ghcr.io/theingof/pm-gpu-arbiter:latest
    container_name: pm-gpu-arbiter
    restart: unless-stopped
    ports:
      - "8790:8790"
    environment:
      OLLAMA_URL: "http://ollama:11434"
      TTS_UPSTREAM_URL: "http://qwen-tts:8880"
      TTS_CONTAINER: "pm-qwen-tts"
      # The first HF download of the Qwen model can take 5+ min;
      # later starts load from the cache volume and are warm in ~15 s.
      TTS_STARTUP_TIMEOUT: "600"
      # After a TTS call the container stays alive for 60 s, which
      # saves the ~7 s restart per chunk during audiobook batches.
      # LLM requests still kill it immediately. Set to 0 to fall back
      # to the old behaviour (stop after every call).
      TTS_IDLE_LINGER_SECONDS: "60"
      PROXY_REQUEST_TIMEOUT: "1800"
    volumes:
      # Docker socket mount so the arbiter can start/stop pm-qwen-tts.
      # Path is identical on Linux and Windows+WSL2.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - ollama

volumes:
  ollama-models:
  docling-cache:
  qwen-tts-hf:

# ----------------------------------------------------------------------
# VRAM budget on a 24 GB card (RTX 3090 / 4090)
# ----------------------------------------------------------------------
#   gemma3:27b           ~18 GB
#   llama3.1:8b           ~6 GB
#   qwen3-tts 1.7B (bf16) ~3.4 GB
#   docling (layout LM)   ~0.5-1 GB
#
# The arbiter serialises Ollama vs. Qwen-TTS, so at most one of the
# two sits in VRAM at the same time. Docling is NOT arbitrated — it
# runs in parallel. In practice this fits because:
#   - Docling + Qwen (both small):     ~4 GB    → OK
#   - Docling + gemma3:27b:            ~19 GB   → OK
#   - Docling + all Ollama models:     tight, but Ollama only keeps
#     the active ones resident (OLLAMA_MAX_LOADED_MODELS=2)
#
# If you OCR a 500-page PDF AND generate an audiobook at the same
# time, it can get tight. Workaround: put Docling on CPU
# (DOCLING_DEVICE: cpu) — slower but no VRAM conflict. Alternatively
# extend the arbiter to manage Docling too (not implemented today).
#
# ----------------------------------------------------------------------
# Smaller GPUs
# ----------------------------------------------------------------------
#   12 GB cards (3060 / 4070):
#     - Ollama model  : llama3.2:3b / qwen2.5:7b-q4_K_M
#     - TTS chunk size: 1500-2500 (Settings → Chunk size)
#     - Docling       : keep on GPU, it's tiny
#
#   8 GB cards (3050 / 4060):
#     - Ollama model  : llama3.2:3b only; disable summary if too slow
#     - TTS chunk size: 1500
#     - Consider CPU Docling to leave room for Qwen
#
# All tunables above are exposed in the Settings modal — no rebuilds
# required when switching models or chunk sizes.
