# Example compose for the external GPU host (Windows+WSL2 or a Linux
# workstation with an NVIDIA GPU, e.g. RTX 3090, 24 GB VRAM).
#
# This stack does NOT run on the Synology — it runs on the GPU host
# next to PageMentor. It boots the shared AI services for both
# PageMentor AND the sibling project doc_storage:
#
#   - ollama          ← LLM + embeddings   (shared — arbiter mediates)
#   - docling         ← GPU PDF extraction (shared — both call directly)
#   - qwen-tts        ← voice-clone TTS    (PageMentor only)
#   - audio-analyzer  ← voice description  (PageMentor only)
#   - pm-gpu-arbiter  ← serialises GPU access (ollama / qwen-tts / analyzer)
#   - infinity        ← jina-embeddings-v3 (shared by PM + doc_storage,
#                                            permanent VRAM, does NOT use
#                                            arbiter — see notes)
#   - qdrant          ← vector DB          (doc_storage only, CPU-only)
#
# The arbiter is the only endpoint PageMentor (on the NAS) talks to —
# port 8790. It transparently forwards requests to ollama (11434) or
# qwen-tts (8880), unloads Ollama models before a TTS call and stops
# the TTS container before an LLM call. Docling runs independently
# (only a few 100 MB VRAM) — see VRAM-budget note at the bottom if
# things get tight.
#
# ----------------------------------------------------------------------
# Deploying on the GPU host:
#
#   1. Copy the file:
#        cp docker-compose.gpu-host.example.yaml docker-compose.yaml
#
#   2. Adjust secrets: DOCLING_SERVE_API_KEY must match DOCLING_API_KEY
#      in the NAS .env — otherwise Docling returns 401.
#
#   3. `docker compose pull && docker compose up -d`
#
#   4. Open firewall on the host. Ports needed from the NAS IP:
#        - 8790 (arbiter)    — PageMentor + doc_storage Ollama traffic
#        - 5001 (docling)    — PageMentor + doc_storage PDF extraction
#        - 8080 (infinity)   — PM + doc_storage embeddings
#        - 6333 (qdrant)     — doc_storage vector DB
#      Ports 11434 (ollama) and 8880 (qwen-tts) stay private — the NAS
#      never talks to them directly.
#
#   5. In PageMentor → Settings → Local TTS → Arbiter URL, set
#      `http://<gpu-host-ip>:8790`. And → LLM → Ollama URL to
#      `http://<gpu-host-ip>:8790` (yes, same port — the arbiter
#      speaks both protocols).

services:
  ollama:
    image: ollama/ollama:latest
    container_name: pm-ollama
    restart: unless-stopped
    # Port 11434 stays exposed only for debug/bypass; PageMentor
    # talks to 8790 (arbiter) instead.
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_KEEP_ALIVE: "30m"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: "q8_0"
      # Default context window for ALL models on this Ollama instance.
      # Ollama's stock default is 4096, which cripples models that
      # natively support 128k+ — including the Gemma 3 / Qwen 2.5 line
      # this stack uses. Modelfiles from the registry do NOT set
      # num_ctx, so this server-side default is the only thing that
      # raises it (per-call num_ctx in the API also overrides — that's
      # what PageMentor's audio preprocessor does).
      #
      # Pick the value that fits the LARGEST model loaded here. KV-cache
      # scales linearly with context × layers × hidden, so tune it
      # against the model that hurts the most. Sizing table below
      # assumes Q4_K_M weights, q8_0 KV-cache, FlashAttention on,
      # 24 GB VRAM (RTX 3090 / 4090):
      #
      #   ┌──────────────────────────────────────────┬─────────┬─────────┐
      #   │ largest model on this instance           │ num_ctx │ ~VRAM   │
      #   ├──────────────────────────────────────────┼─────────┼─────────┤
      #   │  2 B   (gemma3:e2b, qwen2.5:1.5b)        │ 131072  │  ~6 GB  │
      #   │  4 B   (gemma3:4b,  qwen2.5:3b)          │ 131072  │ ~12 GB  │
      #   │  7-8 B (qwen2.5:7b, llama3.1:8b)         │  65536  │ ~18 GB  │
      #   │  9 B   (gemma2:9b)                       │  32768  │ ~16 GB  │
      #   │ 12 B   (gemma3:12b)                      │  32768  │ ~18 GB  │
      #   │ 14 B   (qwen2.5:14b)                     │  16384  │ ~16 GB  │
      #   │ 27 B   (gemma3:27b) ← this stack default │   8192  │ ~20 GB  │
      #   │ 32 B+                                    │   4096  │ tight   │
      #   └──────────────────────────────────────────┴─────────┴─────────┘
      #
      # Switching KV-cache to q4_0 roughly doubles the table — at the
      # cost of noticeable long-context reasoning quality loss.
      # After changing, verify with `ollama ps` (shows actual context)
      # and `nvidia-smi` under load. If you see OOM, step the value
      # down or drop to a smaller model.
      OLLAMA_CONTEXT_LENGTH: "8192"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Init container that pulls all required models on first boot.
  # `restart: "no"` keeps it stopped after a successful pull run.
  # Swap the model list for whatever fits your VRAM budget — these
  # are just the defaults the author uses on a 24 GB 3090.
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_started
    volumes:
      - ollama-models:/root/.ollama
    environment:
      OLLAMA_HOST: "http://ollama:11434"
    entrypoint: >
      sh -c "
      sleep 8 &&
      ollama pull jina/jina-embeddings-v2-base-de &&
      ollama pull nomic-embed-text &&
      ollama pull gemma3:27b &&
      ollama pull llama3.1:8b &&
      ollama pull qwen3:8b &&
      ollama pull qwen3:14b
      "
    # Why qwen3 here too: the sibling project doc_storage uses qwen3:8b
    # (classify + rerank) and qwen3:14b (RAG answers with /think). They
    # share THIS Ollama instance via the arbiter — pulling once means
    # both projects can pick them from the Settings dropdown without
    # touching the host. Ollama is content-addressed so models pulled
    # later (via UI or `ollama pull` on the host) coexist fine.
    restart: "no"

  docling:
    image: quay.io/docling-project/docling-serve:v1.16.1
    container_name: pm-docling
    restart: unless-stopped
    ports:
      - "5001:5001"
    user: "0:0"
    environment:
      UVICORN_PORT: "5001"
      # Must match DOCLING_API_KEY in the NAS .env — otherwise 401.
      DOCLING_SERVE_API_KEY: "change-me-internal"
      DOCLING_SERVE_CORS_ORIGINS: '["*"]'
      DOCLING_SERVE_MAX_FILE_SIZE: "209715200"
      DOCLING_SERVE_MAX_NUM_PAGES: "2000"
      DOCLING_SERVE_ENG_LOC_NUM_WORKERS: "2"
      DOCLING_SERVE_LOAD_MODELS_AT_BOOT: "true"
      DOCLING_DEVICE: cuda
      DOCLING_PERF_PAGE_BATCH_SIZE: "4"
      # ---- Enrichment models (off by default; enable per feature) ----
      # When enabled, doc_storage can flip the matching toggles in
      # Settings → Service Configuration to send `do_picture_description=
      # true` etc. with each /v1/convert/file/async call. Each model is
      # ~1-5 GB on first download, cached under docling-cache.
      #
      # Picture description (SmolVLM):
      #   DOCLING_PICTURE_DESCRIPTION_MODEL: "local"
      #   Pre-warm at boot to avoid the cold-load latency on first call:
      #   DOCLING_PRELOAD_PICTURE_DESCRIPTION: "true"
      #
      # Formula enrichment (RapidLatexOCR or similar):
      #   DOCLING_PRELOAD_FORMULA: "true"
      #
      # Exact env names depend on the docling-serve version — check the
      # container's README. Some builds only honour the converter-level
      # `do_*` form fields and load on demand without an env opt-in.
    volumes:
      - docling-cache:/opt/app-root/src/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Qwen3-TTS voice-clone sidecar. restart: "no" is mandatory — the
  # arbiter is the sole owner and starts/stops the container per
  # request. Docker must not fight it.
  #
  # Three TTS modes are selectable from PageMentor's Settings modal
  # without changing anything here:
  #   - Qwen-Base    → voice-cloned from a reference clip (3-10 s)
  #   - CustomVoice  → nine built-in presets + free-text instruction
  #   - VoiceDesign  → text-described voices (seed-reproducible)
  # The sidecar image handles all three; swap the model tag below if
  # you want Instruct-tuned or a quantised build.
  qwen-tts:
    image: ghcr.io/theingof/pm-qwen-tts:latest
    container_name: pm-qwen-tts
    restart: "no"
    ports:
      - "8880:8880"
    volumes:
      - qwen-tts-hf:/root/.cache/huggingface
    environment:
      QWEN_TTS_MODEL: "Qwen/Qwen3-TTS-12Hz-1.7B-Base"
      QWEN_TTS_DEVICE: "cuda"
      QWEN_TTS_DTYPE: "bfloat16"
      # Attention implementation. The image ships flash-attn 2.7.2
      # prebuilt as part of Stage 1, so no downstream rebuild needed.
      # On Ampere+ (RTX 30/40/50) use flash_attention_2 — ~15% less
      # VRAM and noticeably faster. On Turing or older (RTX 20xx,
      # GTX 16xx, …) flash-attn 2 isn't available, fall back to "sdpa".
      QWEN_TTS_ATTN_IMPL: "flash_attention_2"
      QWEN_TTS_DEFAULT_LANGUAGE: "German"
      # Token / timeout budget. Each character of German narration
      # decodes to roughly 4-5 audio tokens on the 12 Hz codec, so for
      # 4000-char chunks you need ~22000 max_new_tokens and the
      # generation can take 8-12 min on a 3090. Tuned for chunks up
      # to ~4000 chars; lower if your chunks are smaller.
      QWEN_TTS_MAX_NEW_TOKENS: "22000"
      QWEN_TTS_GENERATION_TIMEOUT: "900"
      # Default sampling parameters used when the App-Settings leave
      # a field blank. Lower temperature + tighter top_p reduce
      # chunk-to-chunk timbre drift; repetition_penalty > 1.0 fights
      # the looping/garble bug seen on long voice clones
      # (Qwen3-TTS issue #258).
      QWEN_TTS_DEFAULT_TEMPERATURE: "0.75"
      QWEN_TTS_DEFAULT_TOP_P: "0.8"
      QWEN_TTS_DEFAULT_TOP_K: "40"
      QWEN_TTS_DEFAULT_REPETITION_PENALTY: "1.15"
      # Subtalker (secondary AR head) sampler. Values from the
      # upstream Qwen3-TTS test_model_12hz_base.py example. Leaving
      # subtalker_dosample=false makes the secondary head decode
      # greedy and trigger token loops independently of the main
      # decoder — exactly the looping-garble symptom from issue #258.
      QWEN_TTS_SUBTALKER_DOSAMPLE: "true"
      QWEN_TTS_SUBTALKER_TEMPERATURE: "0.9"
      QWEN_TTS_SUBTALKER_TOP_P: "1.0"
      QWEN_TTS_SUBTALKER_TOP_K: "50"
      # Loop-detection: aborts a generation that has cycled through
      # fewer than `MAX_UNIQUE` audio tokens in the last `WINDOW`.
      # Issue #258 (looping garble on long voice clones). Without
      # this, a stuck generation eats the full GENERATION_TIMEOUT
      # (~20 min) before failing; with it, the call returns 503
      # loop_detected after ~30-60 s and the Backend retries once
      # with a fresh sampling pass.
      QWEN_TTS_LOOP_DETECTION: "true"
      QWEN_TTS_LOOP_WINDOW: "256"
      QWEN_TTS_LOOP_MAX_UNIQUE: "20"
      QWEN_TTS_LOOP_MIN_TOKENS: "1500"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # GPU arbiter — the only endpoint PageMentor actively talks to.
  # Proxy routes:
  #   /api/*      → Ollama   (stops qwen-tts first)
  #   /v1/audio/* → Qwen-TTS (unloads Ollama models + starts qwen-tts
  #                           first, stops it again afterwards)
  #   /admin/gpu/reset → hard-restarts qwen-tts; if OLLAMA_CONTAINER is
  #                      set, hard-restarts Ollama too — otherwise just
  #                      unloads its models. Exposed via the "GPU reset"
  #                      button in the PageMentor UI.
  pm-gpu-arbiter:
    image: ghcr.io/theingof/pm-gpu-arbiter:latest
    container_name: pm-gpu-arbiter
    restart: unless-stopped
    ports:
      - "8790:8790"
    environment:
      OLLAMA_URL: "http://ollama:11434"
      # Optional: when set, GPU-reset hard-restarts the Ollama
      # container instead of just calling its model-unload API.
      # The right hammer when Ollama itself wedges (504 on
      # /api/generate, GPU pegged at 100 %, …).
      OLLAMA_CONTAINER: "ollama"
      TTS_UPSTREAM_URL: "http://qwen-tts:8880"
      TTS_CONTAINER: "pm-qwen-tts"
      # The first HF download of the Qwen model can take 5+ min;
      # later starts load from the cache volume and are warm in ~15 s.
      TTS_STARTUP_TIMEOUT: "600"
      # After a TTS call the container stays alive for 60 s, which
      # saves the ~7 s restart per chunk during audiobook batches.
      # LLM requests still kill it immediately. Set to 0 to fall back
      # to the old behaviour (stop after every call).
      TTS_IDLE_LINGER_SECONDS: "60"
      PROXY_REQUEST_TIMEOUT: "1800"
      # Audio-Analyzer: third arbiter consumer (see audio-analyzer service
      # below). Enabled when the URL/container env vars are set; the
      # arbiter routes /v1/analyze/* to the analyzer and treats it as a
      # mutually-exclusive GPU consumer like ollama and qwen-tts.
      # Requires arbiter image v1.x with audio-analyze mode (see notes
      # at the bottom of this file).
      AUDIO_ANALYZER_UPSTREAM_URL: "http://audio-analyzer:8791"
      AUDIO_ANALYZER_CONTAINER: "pm-audio-analyzer"
      # Audio-analyzer model load is heavy (~12-14 GB AWQ-4bit, downloads
      # 12 GB on first run). The first call after a container start can
      # take 2-3 min while HuggingFace pulls the weights; later loads are
      # ~30 s from the volume cache. Cap generously to avoid spurious
      # 504s during first use.
      AUDIO_ANALYZER_STARTUP_TIMEOUT: "600"
      # Analyzer is one-shot (load → infer → unload). No idle-linger
      # benefit because the next call also needs a cold load. Set to 0
      # explicitly so the arbiter releases the GPU as soon as the
      # response goes out.
      AUDIO_ANALYZER_IDLE_LINGER_SECONDS: "0"
    volumes:
      # Docker socket mount so the arbiter can start/stop pm-qwen-tts.
      # Path is identical on Linux and Windows+WSL2.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - ollama

  # Audio-Analyzer: Qwen3-Omni-30B-A3B-Instruct (AWQ-4bit), one-shot
  # voice-style + transcript description for the voice-clone workflow.
  #
  # Workflow: user uploads a voice sample in the PageMentor UI, clicks
  # "Auto-Vorschlag", backend forwards the audio to the arbiter (which
  # unloads Ollama + qwen-tts first), the analyzer loads its 30B-A3B
  # model into ~12-14 GB VRAM, runs ONE inference returning JSON with
  # transcript + style description, then immediately unloads. Total
  # wall time per call ~30-45 s, mostly model load.
  #
  # Per-request lazy-load + always-unload pattern enforces the user's
  # "ein Modell gleichzeitig auf der GPU" rule trivially — between calls
  # the analyzer holds 0 GB VRAM, so other consumers can use the card
  # without arbitration overhead.
  #
  # restart: "no"  → arbiter starts/stops the container around requests.
  audio-analyzer:
    image: ghcr.io/theingof/pm-audio-analyzer-dev:latest
    # Local builds: `docker compose build audio-analyzer`. First build
    # downloads PyTorch+CUDA base layers, ~5-10 min on a fresh host.
    build:
      context: ./pm-audio-analyzer
    container_name: pm-audio-analyzer
    restart: "no"
    ports:
      - "8791:8791"
    volumes:
      - audio-analyzer-hf:/root/.cache/huggingface
    environment:
      AUDIO_ANALYZER_MODEL: "cyankiwi/Qwen3-Omni-30B-A3B-Instruct-AWQ-4bit"
      AUDIO_ANALYZER_MAX_NEW_TOKENS: "512"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ------------------------------------------------------------------
  # Shared-with-doc_storage additions. Both are ADDITIVE — PageMentor
  # itself doesn't talk to either service, so removing them changes
  # nothing for PageMentor. They live here because they share VRAM /
  # disk with the rest of the GPU host and belong in the same compose
  # for operational sanity (one `docker compose up -d`).
  # ------------------------------------------------------------------

  # infinity-embedding hosting jina-embeddings-v3. Both PageMentor
  # and doc_storage hit this for chunk + query embeddings with
  # task-specific LoRA adapters (retrieval.passage / retrieval.query).
  # Permanently resident in VRAM (~1.1 GB) — does NOT go through
  # pm-gpu-arbiter on purpose:
  #
  #   - The model never swaps, so there's no swap to serialise.
  #   - Going through the arbiter would only burn 50–100 ms per call
  #     while blocking nothing.
  #   - Embeddings are called at high frequency during ingest
  #     (batches of 32 chunks). Queueing them behind Ollama would
  #     stall doc_storage's whole upload pipeline whenever PageMentor
  #     starts an LLM generation.
  #
  # Why infinity and not HuggingFace TEI? TEI is a pure Rust binary
  # and can't host models that need `trust_remote_code` — jina-v3
  # uses a custom XLMRobertaLoRA architecture loaded from
  # `jinaai/xlm-roberta-flash-implementation`. TEI fails the
  # config.json parse with "missing field model_type" and never gets
  # the model loaded. infinity has a Python runtime, accepts
  # trust_remote_code, and exposes the OpenAI-compatible
  # `/v1/embeddings` endpoint which both projects' clients speak.
  #
  # VRAM math on the 24 GB 3090:
  #   24 GB total
  # - 1.1 GB infinity permanent
  # - up to ~20 GB single active Ollama model (Arbiter ensures only
  #     one is loaded at a time across both projects)
  # = ~3 GB headroom for Docling / qwen-tts on-demand pages.
  # Verify with `nvidia-smi` after first qwen-tts call.
  infinity:
    image: michaelf34/infinity:0.0.76
    container_name: pm-infinity
    restart: unless-stopped
    ports:
      - "8080:7997"   # external port 8080 (PM_TEI_URL convention), internal 7997
    command:
      - "v2"
      - "--model-id"
      - "jinaai/jina-embeddings-v3"
      - "--engine"
      - "torch"
      - "--port"
      - "7997"
      - "--batch-size"
      - "32"
    environment:
      HF_HOME: /app/.cache
    volumes:
      - infinity-cache:/app/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Qdrant vector DB — holds the jina-v3 chunk embeddings for
  # doc_storage's RAG retrieval. CPU-only, ~50 MB RAM idle, no VRAM
  # contention. Storage grows with corpus size (~1.5 KB per vector at
  # 1024 dim + payload). Open port 6333 in the host firewall so the
  # NAS-side doc_storage backend can reach it.
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: pm-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  ollama-models:
  docling-cache:
  qwen-tts-hf:
  audio-analyzer-hf:
  infinity-cache:   # jina-embeddings-v3 weights (~1.1 GB after first start)
  qdrant-data:      # doc_storage's vector DB; grows with corpus

# ----------------------------------------------------------------------
# VRAM budget on a 24 GB card (RTX 3090 / 4090)
# ----------------------------------------------------------------------
#   gemma3:27b           ~18 GB
#   llama3.1:8b           ~6 GB
#   qwen3-tts 1.7B (bf16) ~3.4 GB
#   docling (layout LM)   ~0.5-1 GB
#
# The arbiter serialises Ollama vs. Qwen-TTS, so at most one of the
# two sits in VRAM at the same time. Docling is NOT arbitrated — it
# runs in parallel. In practice this fits because:
#   - Docling + Qwen (both small):     ~4 GB    → OK
#   - Docling + gemma3:27b:            ~19 GB   → OK
#   - Docling + all Ollama models:     tight, but Ollama only keeps
#     the active ones resident (OLLAMA_MAX_LOADED_MODELS=2)
#
# If you OCR a 500-page PDF AND generate an audiobook at the same
# time, it can get tight. Workaround: put Docling on CPU
# (DOCLING_DEVICE: cpu) — slower but no VRAM conflict. Alternatively
# extend the arbiter to manage Docling too (not implemented today).
#
# ----------------------------------------------------------------------
# Smaller GPUs
# ----------------------------------------------------------------------
#   12 GB cards (3060 / 4070):
#     - Ollama model  : llama3.2:3b / qwen2.5:7b-q4_K_M
#     - TTS chunk size: 1500-2500 (Settings → Chunk size)
#     - Docling       : keep on GPU, it's tiny
#     - Audio-Analyzer: NOT recommended (Qwen3-Omni-Instruct AWQ-4bit
#       needs ~12-14 GB, leaves no room for anything during analysis)
#
#   8 GB cards (3050 / 4060):
#     - Ollama model  : llama3.2:3b only; disable summary if too slow
#     - TTS chunk size: 1500
#     - Consider CPU Docling to leave room for Qwen
#     - Audio-Analyzer: not viable
#
# All tunables above are exposed in the Settings modal — no rebuilds
# required when switching models or chunk sizes.
#
# ----------------------------------------------------------------------
# Audio-Analyzer arbiter integration — NOT YET IMPLEMENTED in arbiter
# ----------------------------------------------------------------------
# The audio-analyzer service definition above is ready to deploy, but
# the pm-gpu-arbiter image still needs the third-mode logic before the
# /v1/analyze/* route gets serialised against ollama/qwen-tts. Until
# then you can either:
#
#   A) Run the analyzer standalone on a different port, hit it directly
#      from the backend (no GPU sharing safety — make sure no other
#      consumer is active when you click Auto-Vorschlag).
#
#   B) Wait for the arbiter v1.x release which adds AUDIO_ANALYZER_*
#      handling. The env vars in pm-gpu-arbiter above are pre-staged
#      and will activate when the new image lands.
#
# Validation before committing to the full integration: run
# `pm-audio-analyzer/test_local.py path/to/sample.wav` directly on the
# 3090 host (outside Docker) to confirm the model fits and produces
# usable JSON. ~5 min one-shot test, costs nothing if the answer is no.
